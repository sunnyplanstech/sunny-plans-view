<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://maps.googleapis.com" />
    <link rel="preconnect" href="https://maps.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />

    <!--
      Critical CSS — mirrors index.html. Keeps first paint visually
      consistent with the SPA on slow connections, before the full
      Tailwind bundle loads.
    -->
    <style>
      :root {
        --background: 0 0% 100%;
        --foreground: 88 68% 20%;
        --primary: 88 68% 26%;
        --primary-foreground: 0 0% 100%;
        --secondary: 66 56% 48%;
        --muted: 72 35% 90%;
        --muted-foreground: 72 35% 40%;
        --border: 72 35% 85%;
        --gradient-hero: linear-gradient(135deg, hsl(88 68% 26%) 0%, hsl(66 56% 48%) 100%);
        --gradient-subtle: linear-gradient(180deg, hsl(0 0% 100%) 0%, hsl(72 35% 96%) 100%);
      }
      *, *::before, *::after { box-sizing: border-box; border-width: 0; border-style: solid; }
      html { line-height: 1.5; -webkit-text-size-adjust: 100%; font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; }
      body { margin: 0; background-color: hsl(var(--background)); color: hsl(var(--foreground)); }
      #root { min-height: 100vh; }
      .min-h-screen { min-height: 100vh; }
    </style>

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="canonical" href="{{canonicalUrl}}" />

    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="author" content="Sunnyplans" />

    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:type" content="{{ogType}}" />
    <meta property="og:url" content="{{canonicalUrl}}" />
    <meta property="og:image" content="/android-chrome-512x512.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:image" content="/android-chrome-512x512.png" />

    {{cssLinks}}
  </head>

  <body>
    <div id="root">{{ssrBody}}</div>

    <!--
      Shared analytics loader (GA4 + Hotjar + outbound-click tracking).
      Same /analytics.js the SPA and pSEO pages load, proxied from GCS.
    -->
    <script defer src="/analytics.js"></script>
  </body>
</html>
