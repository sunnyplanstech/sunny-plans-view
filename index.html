<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />

    <!-- Analytics still runs on the closed page (GA4 + Hotjar via /analytics.js) -->
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />

    <!-- Critical CSS - inline for instant first paint -->
    <style>
      :root {
        --background: 0 0% 100%;
        --foreground: 88 68% 20%;
        --primary: 88 68% 26%;
        --primary-foreground: 0 0% 100%;
        --secondary: 66 56% 48%;
        --muted: 72 35% 90%;
        --muted-foreground: 72 35% 40%;
        --border: 72 35% 85%;
        --gradient-hero: linear-gradient(135deg, hsl(88 68% 26%) 0%, hsl(66 56% 48%) 100%);
        --gradient-subtle: linear-gradient(180deg, hsl(0 0% 100%) 0%, hsl(72 35% 96%) 100%);
      }
      *, *::before, *::after { box-sizing: border-box; border-width: 0; border-style: solid; }
      html { line-height: 1.5; -webkit-text-size-adjust: 100%; font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; }
      body { margin: 0; background-color: hsl(var(--background)); color: hsl(var(--foreground)); }
      #root { min-height: 100vh; }
      .min-h-screen { min-height: 100vh; }
      .flex { display: flex; }
      .items-center { align-items: center; }
      .justify-center { justify-content: center; }
      .text-center { text-align: center; }
      .relative { position: relative; }
      .overflow-hidden { overflow: hidden; }
      .bg-gradient-subtle { background: var(--gradient-subtle); }
      .container { width: 100%; margin-left: auto; margin-right: auto; padding-left: 1rem; padding-right: 1rem; }
      @media (min-width: 1280px) { .container { max-width: 1280px; } }
    </style>

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    
    <title>SunnyPlans is closed</title>
    <meta name="description" content="SunnyPlans has been switched off. The data and search are no longer available." />
    <meta name="author" content="SunnyPlans" />

    <meta property="og:title" content="SunnyPlans is closed" />
    <meta property="og:description" content="SunnyPlans has been switched off. The data and search are no longer available." />
    <meta property="og:type" content="website" />

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Shared analytics loader (GA4 + Hotjar + outbound-click tracking). -->
    <!-- Source: pipelines/core/seo/static/analytics.js in the parent repo, -->
    <!-- proxied by Netlify from gs://sunnyplans-seo/analytics.js. -->
    <script defer src="/analytics.js"></script>
  </body>
</html>
