# Note on env vars: every VITE_* var is, by Vite contract, inlined into
# the client bundle and shipped to every visitor. They MUST NOT be
# flagged is_secret=true on Netlify — that strips the post_processing
# scope and causes Netlify to substitute the mask string ("****…") into
# the bundle, silently breaking prod. vite.config.ts asserts this at
# build time. No SECRETS_SCAN_OMIT_KEYS needed: with VITE_* vars
# correctly marked non-secret, the scanner has nothing to flag.

# The interactive app is switched off — the SPA (App.tsx) is a single
# static "closed" notice, so there is no /api/* proxy to the backend.
# Only the static marketing surface stays live: the per-vertical blog
# (built by scripts/build-blog.mjs) and the pSEO /solar/* pages proxied
# from GCS, plus their sitemaps. App routes (/, /solar/app, /listing,
# auth, checkout) fall through to the SPA catch-all and show the notice.

# Legacy pSEO URL retirement (p1-e3-pseo-vertical-migration.md).
# The old /united-states/<state>/<county> and /italy/<region>/<province>/<comune>
# shapes are now served as static pages at /solar/<state-or-region>/...
# (US state slugs are full names, so "/united-states/california/..." maps 1:1
# to "/solar/california/..."). Root pages have no equivalent in the new
# shape, so they redirect to the homepage. These must precede the SPA
# catch-all below or the rewrite would mask them.

# Exact-match rules must precede their wildcard siblings: Netlify is
# first-match, and `/united-states/*` greedily matches `/united-states`
# with an empty splat, which would 301 it to `/solar/` (a 404).

[[redirects]]
  from = "/united-states"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/united-states/*"
  to = "/solar/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/italy"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/italy/*"
  to = "/solar/:splat"
  status = 301
  force = true

# SPA exception — must precede the /solar/* GCS proxy below.
# /solar/app/... was the interactive solar map (App.tsx routes); with the
# app switched off these now render the static closed notice. Without this
# rewrite, Netlify's first-match would force-proxy those URLs to
# gs://sunnyplans-seo-eu/solar/app/index.html, which doesn't exist.

[[redirects]]
  from = "/solar/app/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/solar/app"
  to = "/index.html"
  status = 200

# Blog backward compatibility — the blog moved from /blog/... (SPA route)
# to /<vertical>/blog/... (static HTML built by scripts/build-blog.mjs).
# These 301s preserve link equity from articles indexed under the old paths.

[[redirects]]
  from = "/blog"
  to = "/solar/blog"
  status = 301
  force = true

[[redirects]]
  from = "/blog/*"
  to = "/solar/blog/:splat"
  status = 301
  force = true

# Static blog (per vertical) — built into dist/<vertical>/blog/ at deploy
# time. The /solar/* GCS proxy below has force=true, so we need explicit
# "shadow" rewrites to ensure local files take precedence. The sitemap
# rule MUST precede the wildcard, otherwise /solar/blog/sitemap.xml would
# be rewritten to /solar/blog/sitemap.xml/index.html (a 404).
#
# Adding a new vertical = copy this block and replace `solar` → `vanlife`.

[[redirects]]
  from = "/solar/blog/sitemap.xml"
  to = "/solar/blog/sitemap.xml"
  status = 200

[[redirects]]
  from = "/solar/blog"
  to = "/solar/blog/index.html"
  status = 200

[[redirects]]
  from = "/solar/blog/*"
  to = "/solar/blog/:splat/index.html"
  status = 200

# Static pSEO surface served from gs://sunnyplans-seo-eu.
# Pages are rendered as <path>/index.html objects; GCS does not auto-append
# index.html on its public HTTPS endpoint, so the rewrite spells it out.
# Sitemaps (index + per-grain) sit at the bucket root.

[[redirects]]
  from = "/solar/*"
  to = "https://storage.googleapis.com/sunnyplans-seo-eu/solar/:splat/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap*"
  to = "https://storage.googleapis.com/sunnyplans-seo-eu/sitemap:splat"
  status = 200
  force = true

# Shared analytics loader (GA4 + Hotjar + outbound-click tracking).
# Source: pipelines/core/seo/static/analytics.js, published to GCS via
# `make publish-analytics`. Both the SPA and the static pSEO pages load
# it from /analytics.js so there's one source of truth for tracking.
[[redirects]]
  from = "/analytics.js"
  to = "https://storage.googleapis.com/sunnyplans-seo-eu/analytics.js"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
