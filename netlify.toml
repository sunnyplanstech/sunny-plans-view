# SunnyPlans is switched off. Every path serves the single static notice
# (src/App.tsx). The old rules — /api proxy to the backend, the /solar/*
# pSEO surface proxied from GCS, blog, sitemaps — are removed; restore them
# from git history to bring the product back. Analytics is kept so we can
# still see what traffic lands on the closed page.

# Shared analytics loader (GA4 + Hotjar). Source:
# pipelines/core/seo/static/analytics.js, published to GCS. Must precede
# the SPA catch-all or /analytics.js would serve index.html instead.
[[redirects]]
  from = "/analytics.js"
  to = "https://storage.googleapis.com/sunnyplans-seo-eu/analytics.js"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
